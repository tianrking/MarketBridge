name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MARKETBRIDGE_BUILD_REVISION: ${{ github.sha }}

jobs:
  rust:
    name: fmt + clippy + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Independently verify committed native recovery evidence
        run: python -B scripts/verify_native_evidence.py docs/validation/2026-10-19-native-recovery-books

      - name: Enforce Python-only strategy examples
        run: >
          python -c "from pathlib import Path; p=next(Path('examples').rglob('*.rs'), None); assert p is None, f'Rust strategy example found: {p}'"

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features

      - name: Test Redis AOF, restart and deduplicated outbox replay
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git clone --depth 1 --branch 7.4.2 https://github.com/redis/redis.git "$RUNNER_TEMP/marketbridge-redis"
          test "$(git -C "$RUNNER_TEMP/marketbridge-redis" rev-parse HEAD)" = a0a6f23d997b024689ba157916837f493a593a34
          make -C "$RUNNER_TEMP/marketbridge-redis" -j2 MALLOC=libc BUILD_TLS=no redis-server
          MARKETBRIDGE_TEST_REDIS_SERVER="$RUNNER_TEMP/marketbridge-redis/src/redis-server" cargo test --locked --all-features durable_outbox_against_real_redis -- --ignored

      - name: Build research CLI and server
        run: cargo build --locked

      - name: Test actual pipeline, Redis outage, server restart and finite recovery
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -B scripts/accept_pipeline.py --binary target/debug/market-bridge --redis-server "$RUNNER_TEMP/marketbridge-redis/src/redis-server" --duration 30 --rate 1000 --symbols 16 --sample-seconds 1 --output "$RUNNER_TEMP/marketbridge-acceptance"

      - name: Test native wire protocols, automatic recovery, L2 resync and restart
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -B scripts/accept_native_protocols.py --binary target/debug/market-bridge --redis-server "$RUNNER_TEMP/marketbridge-redis/src/redis-server" --output "$RUNNER_TEMP/marketbridge-native-protocols"

      - name: Test compact recovery and native protocols on Windows and macOS
        if: runner.os != 'Linux'
        run: python -B scripts/accept_native_protocols.py --output "${{ runner.temp }}/marketbridge-native-compact"

      - name: Test portable process startup and shutdown
        run: python -B scripts/Test-ProcessLifecycle.py

      - name: Python research client contract tests
        run: python -m pip install -r sdk/python/requirements.txt

      - name: Test synchronous and asynchronous research clients
        run: python -B -m unittest discover -s sdk/python -p "test_*.py"

      - name: Test Python strategy examples
        run: python -B scripts/run_python_example_tests.py

      - name: Local HTTP research smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-ResearchApi.ps1 -Python python
