name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust:
    name: fmt + clippy + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features

      - name: Build research CLI and server
        run: cargo build --locked

      - name: Python research client contract tests
        run: python -B -m unittest discover -s sdk/python -p "test_*.py"

      - name: Local HTTP research smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-ResearchApi.ps1
